name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-test:
    name: 离线冒烟测试 (Windows / Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: 跑 test_logic.py (映射单调 / 调节节奏 / 抗瞬时干扰)
        shell: pwsh
        run: |
          $log = python test_logic.py 2>&1 | Out-String
          Write-Output $log
          if ($log -match 'FAIL') {
            Write-Output "::error::离线测试出现 FAIL"
            exit 1
          }